name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SabemiPagamentos.sln

      - name: Build
        run: dotnet build SabemiPagamentos.sln --configuration Release --no-restore

      - name: Testes (unitarios e de integracao)
        run: dotnet test SabemiPagamentos.sln --configuration Release --no-build --logger "trx;LogFileName=testes.trx" --collect:"XPlat Code Coverage"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: "**/TestResults/**"

  frontend:
    name: Painel (React + TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Checagem de tipos
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build da API
        run: docker build -t sabemi-api:ci .

      - name: Build do painel
        run: docker build -t sabemi-painel:ci ./web
