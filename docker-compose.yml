services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sabemi-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sabemi_dev_123"
      MSSQL_PID: Developer
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sabemi-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=SabemiPagamentos;User Id=sa;Password=Sabemi_dev_123;TrustServerCertificate=True;Encrypt=False"
      Database__MigrarNoStartup: "true"
      # 2 segundos de regra "pesada", como pede o desafio.
      Processamento__AtrasoSimuladoMs: "2000"
      Processamento__Concorrencia: "4"
      Webhook__ExigirAssinatura: "true"
      Webhook__Parceiros__0__Nome: "banco-parceiro"
      Webhook__Parceiros__0__ApiKey: "sabemi-dev-api-key"
      Webhook__Parceiros__0__Segredo: "segredo-hmac-de-desenvolvimento"
    ports:
      - "5090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sabemi-painel
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  sqlserver-data:
